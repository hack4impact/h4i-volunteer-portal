# Staging stack. Runs on a developer's computer (wiki decision 29); start it with ./up.sh.
# deploy/staging/.env (gitignored, chmod 600) must define PORTAL_DB_PASSWORD. Build it from the vault with
# ../fetch-secrets.sh "portal staging" .env
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?set PORTAL_DB_PASSWORD in deploy/staging/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portal", "-d", "portal"]
      interval: 5s
      retries: 10

  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/hack4impact/h4i-volunteer-portal:main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/portal
      SPRING_DATASOURCE_USERNAME: portal
      SPRING_DATASOURCE_PASSWORD: ${PORTAL_DB_PASSWORD:?set PORTAL_DB_PASSWORD in deploy/staging/.env}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8081}
    # 8081 so staging and `./gradlew bootRun` (8080) can run side by side. Localhost only.
    ports:
      - "127.0.0.1:${STAGING_PORT:-8081}:8080"

volumes:
  db-data:

# Staging stack on the DigitalOcean droplet. CI copies this file to ~/portal/ and sets PORTAL_IMAGE.
# ~/portal/.env must define PORTAL_DB_PASSWORD (and later the tool credentials); chmod 600.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?set PORTAL_DB_PASSWORD in ~/portal/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portal", "-d", "portal"]
      interval: 5s
      retries: 10

  portal:
    image: ${PORTAL_IMAGE:?set by CI}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/portal
      SPRING_DATASOURCE_USERNAME: portal
      SPRING_DATASOURCE_PASSWORD: ${PORTAL_DB_PASSWORD:?set PORTAL_DB_PASSWORD in ~/portal/.env}
    # Bound to localhost until a reverse proxy with TLS fronts it.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  image:
    name: Build and push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: PORTAL_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: image
    # Skipped until the staging droplet exists and the STAGING_HOST repo variable is set.
    if: vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.STAGING_HOST }}
      USER: ${{ secrets.STAGING_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging
          chmod 600 ~/.ssh/staging
          echo "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose file
        run: scp -i ~/.ssh/staging deploy/staging/compose.yml "$USER@$HOST:~/portal/compose.yml"
      - name: Log droplet in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/staging "$USER@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/staging "$USER@$HOST" \
            "cd ~/portal \
             && export PORTAL_IMAGE='${{ needs.image.outputs.image }}:${{ github.sha }}' \
             && docker compose pull && docker compose up -d --wait; \
             status=\$?; docker logout ghcr.io; exit \$status"
      - name: Smoke test
        run: |
          ssh -i ~/.ssh/staging "$USER@$HOST" "curl -sf http://127.0.0.1:8080/api/status" \
            | grep -q '"version":"${{ github.sha }}"'

# Step 9 finish line: REALLY changes the sandboxes through the sync engine (create, add, re-run, roll back, clean up).
# Use scripts/sandbox-e2e.sh, which runs it against a throwaway Postgres.
spring:
  main:
    web-application-type: none

portal:
  sandbox-e2e:
    enabled: true
  sync:
    # The suite runs the engine itself; requests from approvals mustn't start overlapping background runs.
    on-request: false
  agreements:
    # Likewise for agreements: the suite runs its own passes.
    on-request: false
    schedule-enabled: false

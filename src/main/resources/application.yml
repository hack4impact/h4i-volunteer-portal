spring:
  application:
    name: portal
  flyway:
    schemas: portal
  jooq:
    sql-dialect: postgres
  # Locally, `./gradlew bootRun` starts compose.yaml and connects to it. Elsewhere set
  # SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.

portal:
  # Set by CI to the git SHA; "dev" locally.
  version: ${PORTAL_VERSION:dev}
  # Public address of this deployment, for OAuth redirects, emails and links (wiki decision 31).
  # Staging will probably be https://staging.portal.hack4impact.org; change it here or with PORTAL_BASE_URL only.
  base-url: ${PORTAL_BASE_URL:http://localhost:8080}
  import:
    member-db:
      url: ${MEMBER_DB_URL:}
      username: ${MEMBER_DB_USERNAME:}
      password: ${MEMBER_DB_PASSWORD:}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
